<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rogue Expedition</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1115;color:#eef5f6;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#app{max-width:900px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.stats{font-size:13px;color:#bfd0d6}.map{margin-top:10px;display:grid;grid-template-columns:repeat(12,1fr);aspect-ratio:12/8;border:1px solid #41545c;border-radius:12px;overflow:hidden;background:#132027}.tile{display:flex;align-items:center;justify-content:center;border:1px solid #ffffff0b;background:#294836;font-size:clamp(15px,4vw,30px);position:relative}.tile.dirt{background:#5a4734}.tile.water{background:#244d62}.tile.rock{background:#394642}.tile.tree{background:#274034}.player{width:62%;height:62%;border-radius:50%;background:#71b9d6;border:2px solid #e4faff;display:flex;align-items:center;justify-content:center}.controls{width:170px;height:170px;position:relative;margin:18px auto 6px;touch-action:none}.btn{position:absolute;width:58px;height:58px;border:1px solid #78909c;border-radius:18px;background:#18242b;color:white;font-size:24px}.up{left:56px}.left{left:0;top:56px}.right{right:0;top:56px}.down{left:56px;bottom:0}.log{min-height:42px;text-align:center;color:#c9d6da;font-size:13px}.banner{padding:9px 11px;background:#172329;border:1px solid #344851;border-radius:10px;font-size:13px}@media(min-width:800px){.controls{width:150px;height:150px}.btn{width:52px;height:52px}.up{left:49px}.left,.right{top:49px}.down{left:49px}}
</style>
</head><body><main id="app"><div class="top"><div><b>ROGUE EXPEDITION</b><div class="stats" id="stats"></div></div><div class="banner">手機測試版</div></div><div class="map" id="map"></div><div class="controls"><button class="btn up" data-d="0,-1">▲</button><button class="btn left" data-d="-1,0">◀</button><button class="btn right" data-d="1,0">▶</button><button class="btn down" data-d="0,1">▼</button></div><div class="log" id="log">方向鍵移動。這個版本先確認 GitHub Pages 與手機執行正常。</div></main><script>
const W=12,H=8;let p={x:2,y:4,hp:100};const terrain=Array.from({length:W*H},(_,i)=>{const x=i%W,y=Math.floor(i/W);if((x===7&&y>1&&y<7)||(x===8&&y===6))return'water';if((x===5&&y===2)||(x===9&&y===3))return'rock';if((x===4&&y===5)||(x===10&&y===1))return'tree';return Math.random()<.18?'dirt':'grass'});const objects=[{x:6,y:4,e:'🎁'},{x:10,y:5,e:'💀'},{x:3,y:1,e:'✨'}];function idx(x,y){return y*W+x}function blocked(x,y){return x<0||y<0||x>=W||y>=H||['water','rock','tree'].includes(terrain[idx(x,y)])}function draw(){let s='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=terrain[idx(x,y)];let c='tile '+t,inside='';const o=objects.find(o=>o.x===x&&o.y===y);if(o)inside=o.e;if(x===p.x&&y===p.y)inside='<span class="player">🧙</span>';else if(!inside&&t==='rock')inside='🪨';else if(!inside&&t==='tree')inside='🌲';else if(!inside&&t==='water')inside='≋';s+=`<div class="${c}" data-x="${x}" data-y="${y}">${inside}</div>`}map.innerHTML=s;stats.textContent=`HP ${p.hp}/100　位置 ${p.x},${p.y}`}function move(dx,dy){const x=p.x+dx,y=p.y+dy;if(blocked(x,y)){log.textContent='這裡過不去。';return}p.x=x;p.y=y;const o=objects.find(o=>o.x===x&&o.y===y);if(o){log.textContent=o.e==='🎁'?'找到寶箱！未來這裡會抽技能卡。':o.e==='💀'?'遭遇怪物！戰鬥系統下一步接回來。':'發現神殿。'}else log.textContent='繼續探索…';draw()}document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const [dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)}));map.addEventListener('pointerdown',e=>{const t=e.target.closest('.tile');if(!t)return;const x=+t.dataset.x,y=+t.dataset.y,dx=x-p.x,dy=y-p.y;if(Math.abs(dx)+Math.abs(dy)===1)move(dx,dy)});addEventListener('keydown',e=>{const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(k){e.preventDefault();move(...k)}});draw();
</script></body></html>
